<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Grade Calculator</title>
    <!-- 9: Link to external stylesheet style.css -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Student Grade Calculator</h2>
        
        <!-- Fixed Line 9: Added 'return' so form does not refresh the page -->
        <form name="gradeForm" onsubmit="return checkMark()">
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name"><br><br>
            
            <label for="mark">Mark (0-100):</label><br>
            <input type="text" id="mark" name="mark"><br><br>
            
            <button type="submit">Check Grade</button>
            <!-- 7: Random Mark button -->
            <button type="button" onclick="generateRandomMark()">Random Mark</button>
        </form>

        <p id="result"></p>
        <!-- 8: Element to display checked date and time -->
        <p id="checkedTime"></p>

        <!-- Fixed Line 17: Corrected 'showtable()' to 'showTable()' -->
        <button onclick="showTable()">Show Grade Table</button>
        <div id="tableContainer"></div>
    </div>

    <!-- Fixed Line 19: Corrected 'grades.js' to 'grade.js' -->
    <script src="grade.js"></script>
</body>
</html>
