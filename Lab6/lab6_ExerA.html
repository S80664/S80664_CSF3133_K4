<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors</title>
    <!-- Link to external CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Header section with title and short instruction -->
        <header>
            <h1>Rock, Paper, Scissors</h1>
            <p>Enter your name, click Start Game, then choose Rock, Paper or Scissors.</p>
        </header>

        <!-- Player section with Name input and Start Game button -->
        <section class="card">
            <label for="playerName">Your name: </label>
            <input type="text" id="playerName" placeholder="Enter your name">
            <button onclick="startGame()">Start Game</button>
            <p id="welcomeMsg"></p>
        </section>

        <!-- Game section with choice buttons and images -->
        <section class="card">
            <div class="choices">
                <button onclick="playRound('rock')">Rock</button>
                <button onclick="playRound('paper')">Paper</button>
                <button onclick="playRound('scissors')">Scissors</button>
            </div>

            <div class="arena">
                <div>
                    <p><strong>You</strong></p>
                    <img id="playerImg" src="rock.png" alt="Player Choice">
                </div>
                <div class="vs">VS</div>
                <div>
                    <p><strong>Computer</strong></p>
                    <img id="computerImg" src="rock.png" alt="Computer Choice">
                </div>
            </div>
        </section>

        <!-- Result section with result text and scoreboard -->
        <section class="card">
            <p id="result"></p>
            <p class="scoreboard">
                Wins: <span id="wins">0</span> | 
                Losses: <span id="losses">0</span> | 
                Draws: <span id="draws">0</span>
            </p>
        </section>

        <!-- History section with table, Show Summary and Reset buttons -->
        <section class="card">
            <h3>History</h3>
            <table id="history">
                <thead>
                    <tr>
                        <th>Round</th>
                        <th>You</th>
                        <th>Computer</th>
                        <th>Result</th>
                    </tr>
                </thead>
                <tbody id="historyBody">
                    <!-- Round rows will be inserted here via JavaScript -->
                </tbody>
            </table>

            <div class="controls">
                <button onclick="showSummary()">Show Summary</button>
                <button onclick="resetGame()">Reset</button>
            </div>
            <p id="summaryText"></p>
        </section>

        <!-- Footer with startTime and copyright -->
        <footer>
            <p id="startTime"></p>
            <p>&copy; 2026 Computer Science Club</p>
        </footer>
    </div>

    <!-- Link to external JavaScript -->
    <script src="game.js"></script>
</body>
</html>
